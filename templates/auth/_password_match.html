<script nonce="{{ csp_nonce() }}">
  (function () {
    const pw = document.getElementById('password');
    const confirmPw = document.getElementById('confirm_password');
    if (!pw || !confirmPw) return;
    function check() {
      let msg = '';
      if (pw.value && (!/[A-Za-z]/.test(pw.value) || !/\d/.test(pw.value))) msg = 'Use at least one letter and one number.';
      pw.setCustomValidity(msg);
      confirmPw.setCustomValidity(confirmPw.value && confirmPw.value !== pw.value ? 'Passwords do not match.' : '');
    }
    pw.addEventListener('input', check);
    confirmPw.addEventListener('input', check);
  })();
</script>
