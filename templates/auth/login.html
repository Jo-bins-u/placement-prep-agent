{% extends "base.html" %}
{% block title %}Log in - Prepwise{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card card">
    <div class="auth-header">
      <h1 class="display">Welcome back</h1>
      <p class="subtitle">Log in to continue your preparation.</p>
    </div>


    <form method="post" action="{{ url_for('login') }}" class="auth-form" data-busy-label="Logging in…">{{ csrf_field() }}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required value="{{ email }}" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
        <div class="auth-field-footer">
          <a href="{{ url_for('forgot_password') }}" class="link-button small" data-forgot>Forgot password?</a>
        </div>
      </div>
      
      <button type="submit" class="btn btn-primary full-width" id="login-submit-btn">Log in</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="{{ url_for('register') }}" class="link-button">Sign up</a></p>
    </div>
  </div>
</section>
{% endblock %}


{% block scripts %}
<script nonce="{{ csp_nonce() }}">
  // Carry the typed email over to the forgot-password page.
  (function () {
    const link = document.querySelector('[data-forgot]');
    const email = document.getElementById('email');
    link.addEventListener('click', function () {
      if (email.value) link.href = link.href.split('?')[0] + '?email=' + encodeURIComponent(email.value);
    });
  })();
</script>
{% endblock %}
