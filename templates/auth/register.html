{% extends "base.html" %}
{% block title %}Register - Prepwise{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card card">
    <div class="auth-header">
      <h1 class="display">Create your account</h1>
      <p class="subtitle">Join Prepwise to build your personalized preparation path.</p>
    </div>


    <form method="post" action="{{ url_for('register') }}" class="auth-form" data-busy-label="Creating account…">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6" placeholder="Repeat your password" autocomplete="new-password">
      </div>
      
      <button type="submit" class="btn btn-primary full-width">Sign up</button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="{{ url_for('login') }}" class="link-button">Log in</a></p>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    var pw = document.getElementById('password');
    var confirmPw = document.getElementById('confirm_password');
    function check() {
      confirmPw.setCustomValidity(confirmPw.value && confirmPw.value !== pw.value ? 'Passwords do not match.' : '');
    }
    pw.addEventListener('input', check);
    confirmPw.addEventListener('input', check);
  })();
</script>
{% endblock %}
