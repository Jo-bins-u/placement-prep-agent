{# Six single-digit boxes that fill a hidden "otp" field. Supports typing, paste, autofill and arrow keys. #}
<div class="form-group">
  <label id="otp-label" for="otp-0">Verification code</label>
  <div class="otp-inputs" role="group" aria-labelledby="otp-label">
    {% for i in range(6) %}
    <input type="text" id="otp-{{ i }}" inputmode="numeric" maxlength="1" pattern="[0-9]" class="otp-digit"
           required autocomplete="{{ 'one-time-code' if i == 0 else 'off' }}" aria-label="Digit {{ i + 1 }}">
    {% endfor %}
  </div>
  <input type="hidden" name="otp" id="full-otp">
</div>
<script nonce="{{ csp_nonce() }}">
  (function () {
    const inputs = Array.from(document.querySelectorAll('.otp-digit'));
    const hidden = document.getElementById('full-otp');
    const sync = function () { hidden.value = inputs.map(function (i) { return i.value; }).join(''); };
    function fillFrom(index, text) {
      const digits = (text || '').replace(/\D/g, '').slice(0, inputs.length - index);
      digits.split('').forEach(function (d, k) { inputs[index + k].value = d; });
      inputs[Math.min(index + digits.length, inputs.length - 1)].focus();
      sync();
    }
    inputs.forEach(function (input, index) {
      input.addEventListener('input', function () {
        const value = input.value.replace(/\D/g, '');
        if (value.length > 1) { input.value = ''; fillFrom(index, value); return; }
        input.value = value;
        if (value && index < inputs.length - 1) inputs[index + 1].focus();
        sync();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && input.value === '' && index > 0) {
          inputs[index - 1].value = ''; inputs[index - 1].focus(); sync(); e.preventDefault();
        } else if (e.key === 'ArrowLeft' && index > 0) { inputs[index - 1].focus(); }
        else if (e.key === 'ArrowRight' && index < inputs.length - 1) { inputs[index + 1].focus(); }
      });
      input.addEventListener('paste', function (e) {
        e.preventDefault();
        fillFrom(index, (e.clipboardData || window.clipboardData).getData('text'));
      });
    });
    const form = hidden.closest('form');
    if (form) form.addEventListener('submit', sync);
    inputs[0].focus();
  })();
</script>
