{% extends "base.html" %}
{% block title %}Forgot Password - Prepwise{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card card">
    <div class="auth-header">
      <h1 class="display">Forgot your password?</h1>
      <p class="subtitle">Enter your account email and we'll send you a code to reset it.</p>
    </div>

    <form method="post" action="{{ url_for('forgot_password') }}" class="auth-form" data-busy-label="Sending code…">{{ csrf_field() }}
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required value="{{ email }}" placeholder="you@example.com" autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary full-width">Send reset code</button>
    </form>

    <div class="auth-footer">
      <p>Remembered it? <a href="{{ url_for('login') }}" class="link-button">Back to log in</a></p>
    </div>
  </div>
</section>
{% endblock %}
