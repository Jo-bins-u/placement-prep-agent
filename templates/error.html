{% extends "base.html" %}
{% block title %}{{ title }} - Prepwise{% endblock %}
{% block content %}
<div class="submission-shell">
  <section class="card panel-block">
    <p class="eyebrow">Error {{ code }}</p>
    <h1 class="display">{{ title }}</h1>
    <p class="feedback-copy">{{ message }}</p>
    <div class="action-row">
      <a href="{{ url_for('home') }}" class="btn btn-primary">Go to home</a>
    </div>
  </section>
</div>
{% endblock %}
