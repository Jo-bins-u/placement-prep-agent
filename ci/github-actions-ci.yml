name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pip-audit bandit
      - name: Unit and security tests
        run: python -m pytest -q
      - name: Validation suites
        run: python -m validation.run --quick
      - name: Known-vulnerable dependencies (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Static security scan (bandit, medium and above)
        run: bandit -q -r . -x ./.venv,./tests,./validation -ll
